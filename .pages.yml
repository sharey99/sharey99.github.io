{
  "media": {
    "input": "files",
    "output": "/files",
    "rename": false,
    "extensions": [
      "pdf",
      "epub",
      "txt",
      "md",
      "docx",
      "xlsx",
      "pptx",
      "png",
      "jpg",
      "jpeg",
      "webp",
      "gif",
      "mp4",
      "webm",
      "vtt"
    ]
  },
  "content": [
    {
      "name": "navigation",
      "label": "顶部分类管理 · 改名 / 新增 / 删除",
      "type": "collection",
      "path": "_data/navigation",
      "format": "json",
      "filename": {
        "template": "category-{year}{month}{day}-{hour}{minute}{second}.json",
        "field": false
      },
      "operations": {
        "create": true,
        "rename": false,
        "delete": true
      },
      "subfolders": false,
      "view": {
        "primary": "title",
        "fields": [
          "title",
          "order",
          "hidden"
        ],
        "sort": [
          "order",
          "title"
        ],
        "search": [
          "title"
        ],
        "default": {
          "sort": "order",
          "order": "asc"
        }
      },
      "fields": [
        {
          "name": "title",
          "label": "分类标题",
          "type": "string",
          "required": true,
          "options": {
            "maxlength": 40
          },
          "description": "这里的文字就是网站顶部选项卡和后台对应栏目的名称。"
        },
        {
          "name": "order",
          "label": "显示顺序",
          "type": "number",
          "description": "数字越小越靠前。"
        },
        {
          "name": "hidden",
          "label": "暂时隐藏此分类",
          "type": "boolean",
          "description": "勾选后从网站暂时隐藏；默认显示。删除分类也不会删除原有卡片文件。"
        }
      ]
    },
    {
      "name": "home",
      "label": "主页 · 全部收藏",
      "type": "group",
      "items": [
        {
          "name": "home-introduction",
          "label": "开场介绍与收藏标题",
          "type": "file",
          "path": "_data/home/introduction.json",
          "format": "json",
          "fields": [
            {
              "name": "titleFirst",
              "label": "一级标题 · 第一行",
              "type": "string",
              "required": true
            },
            {
              "name": "titleSecond",
              "label": "一级标题 · 第二行",
              "type": "string",
              "required": true
            },
            {
              "name": "eyebrow",
              "label": "标题上方短句",
              "type": "string"
            },
            {
              "name": "description",
              "label": "开场简介",
              "type": "text"
            },
            {
              "name": "collectionTitle",
              "label": "二级标题 · 收藏区域",
              "type": "string",
              "required": true
            },
            {
              "name": "collectionEyebrow",
              "label": "收藏标题上方短句",
              "type": "string"
            }
          ]
        }
      ]
    },
    {
      "name": "tools",
      "label": "好用网站",
      "type": "collection",
      "path": "_data/cards/tools",
      "format": "json",
      "filename": {
        "template": "{year}{month}{day}-{hour}{minute}{second}-{primary}.json",
        "field": false
      },
      "subfolders": false,
      "exclude": [
        ".gitkeep"
      ],
      "view": {
        "primary": "title",
        "fields": [
          "title",
          "description",
          "date"
        ],
        "sort": [
          "order",
          "date",
          "title"
        ],
        "search": [
          "title",
          "description",
          "tags"
        ],
        "default": {
          "sort": "order",
          "order": "asc"
        }
      },
      "fields": [
        {
          "name": "title",
          "label": "一级标题 · 卡片名称",
          "type": "string",
          "required": true
        },
        {
          "name": "description",
          "label": "一句话简介",
          "type": "text",
          "required": true
        },
        {
          "name": "url",
          "label": "外部网址（可选）",
          "type": "string",
          "description": "网站、课程或视频的 HTTPS 原始链接。写站内文章时可以不填。",
          "pattern": {
            "regex": "^(https://[^\\s]+)?$",
            "message": "请填 https:// 开头的网址；没有外链则留空。"
          }
        },
        {
          "name": "attachment",
          "label": "附件（可选）",
          "type": "file",
          "description": "选择或上传有权公开的小文件。上传后文件公开；大视频请使用外部平台链接。"
        },
        {
          "name": "body",
          "label": "文章正文 · 段落",
          "type": "object",
          "list": {
            "collapsible": {
              "collapsed": true,
              "summary": "{heading}（第 {index} 段）"
            }
          },
          "description": "添加段落；小标题可不填，正文支持多行纯文本。有正文时展开阅读，外链和附件放在文章底部。",
          "fields": [
            {
              "name": "heading",
              "label": "二级标题 · 正文小标题（可选）",
              "type": "string"
            },
            {
              "name": "text",
              "label": "这一段的正文",
              "type": "text",
              "required": true
            }
          ]
        },
        {
          "name": "tags",
          "label": "标签（可选）",
          "type": "string",
          "list": true
        },
        {
          "name": "date",
          "label": "收录日期",
          "type": "date",
          "required": true,
          "options": {
            "format": "yyyy-MM-dd"
          }
        },
        {
          "name": "kind",
          "label": "角标文字（可选）",
          "type": "string",
          "description": "例如：官方入口、个人笔记、原创攻略。留空显示“个人分享”。"
        },
        {
          "name": "icon",
          "label": "图标（可选）",
          "type": "select",
          "options": {
            "values": [
              {
                "name": "pen",
                "label": "画笔"
              },
              {
                "name": "spark",
                "label": "星光"
              },
              {
                "name": "play",
                "label": "视频"
              },
              {
                "name": "image",
                "label": "图像"
              },
              {
                "name": "radio",
                "label": "电台"
              },
              {
                "name": "book",
                "label": "书籍"
              },
              {
                "name": "game",
                "label": "游戏"
              },
              {
                "name": "code",
                "label": "代码"
              },
              {
                "name": "leaf",
                "label": "生活"
              },
              {
                "name": "note",
                "label": "笔记"
              }
            ]
          }
        },
        {
          "name": "tone",
          "label": "图标颜色（可选）",
          "type": "select",
          "options": {
            "values": [
              {
                "name": "green",
                "label": "绿色"
              },
              {
                "name": "blue",
                "label": "蓝色"
              },
              {
                "name": "peach",
                "label": "浅橙"
              },
              {
                "name": "purple",
                "label": "紫色"
              },
              {
                "name": "yellow",
                "label": "黄色"
              }
            ]
          }
        },
        {
          "name": "order",
          "label": "卡片排序（可选）",
          "type": "number",
          "description": "数字越小越靠前；留空的新卡片排在已有卡片后面。"
        }
      ]
    },
