{
  "media": {
    "input": "files",
    "output": "/files",
    "rename": "safe",
    "extensions": [
      "pdf",
      "epub",
      "txt",
      "md",
      "docx",
      "xlsx",
      "pptx",
      "png",
      "jpg",
      "jpeg",
      "webp",
      "gif",
      "mp4",
      "webm",
      "vtt"
    ]
  },
  "content": [
    {
      "name": "collection",
      "label": "网站收藏与笔记",
      "type": "file",
      "path": "content.json",
      "format": "json",
      "list": true,
      "fields": [
        {
          "name": "title",
          "label": "标题",
          "type": "string",
          "required": true
        },
        {
          "name": "category",
          "label": "分类",
          "type": "select",
          "required": true,
          "options": {
            "values": [
              {
                "name": "tools",
                "label": "好用网站"
              },
              {
                "name": "fun",
                "label": "有趣网站"
              },
              {
                "name": "games",
                "label": "游戏攻略"
              },
              {
                "name": "life",
                "label": "人生攻略"
              },
              {
                "name": "notes",
                "label": "随笔笔记"
              }
            ]
          }
        },
        {
          "name": "description",
          "label": "一句话简介",
          "type": "text",
          "required": true
        },
        {
          "name": "url",
          "label": "外部网址（可选）",
          "type": "string",
          "description": "网站、课程或视频的 HTTPS 原始链接。写站内文章时可以不填。",
          "pattern": {
            "regex": "^(https://[^\\s]+)?$",
            "message": "请填 https:// 开头的网址；没有外链则留空。"
          }
        },
        {
          "name": "attachment",
          "label": "附件（可选）",
          "type": "file",
          "description": "选择或上传有权公开的小文件。上传后文件公开；大视频请使用外部平台链接。"
        },
        {
          "name": "body",
          "label": "文章正文（可选）",
          "type": "object",
          "list": {
            "collapsible": {
              "collapsed": true,
              "summary": "{heading}（第 {index} 段）"
            }
          },
          "description": "添加段落；小标题可不填，正文支持多行纯文本。有正文时展开阅读，外链和附件放在文章底部。",
          "fields": [
            {
              "name": "heading",
              "label": "小标题（可选）",
              "type": "string"
            },
            {
              "name": "text",
              "label": "正文",
              "type": "text",
              "required": true
            }
          ]
        },
        {
          "name": "tags",
          "label": "标签（可选）",
          "type": "string",
          "list": true
        },
        {
          "name": "date",
          "label": "收录日期",
          "type": "date",
          "required": true,
          "options": {
            "format": "yyyy-MM-dd"
          }
        },
        {
          "name": "kind",
          "label": "角标文字（可选）",
          "type": "string",
          "description": "例如：官方入口、个人笔记、原创攻略。留空显示“个人分享”。"
        },
        {
          "name": "icon",
          "label": "图标（可选）",
          "type": "select",
          "options": {
            "values": [
              {
                "name": "pen",
                "label": "画笔"
              },
              {
                "name": "spark",
                "label": "星光"
              },
              {
                "name": "play",
                "label": "视频"
              },
              {
                "name": "image",
                "label": "图像"
              },
              {
                "name": "radio",
                "label": "电台"
              },
              {
                "name": "book",
                "label": "书籍"
              },
              {
                "name": "game",
                "label": "游戏"
              },
              {
                "name": "code",
                "label": "代码"
              },
              {
                "name": "leaf",
                "label": "生活"
              },
              {
                "name": "note",
                "label": "笔记"
              }
            ]
          }
        },
        {
          "name": "tone",
          "label": "图标颜色（可选）",
          "type": "select",
          "options": {
            "values": [
              {
                "name": "green",
                "label": "绿色"
              },
              {
                "name": "blue",
                "label": "蓝色"
              },
              {
                "name": "peach",
                "label": "浅橙"
              },
              {
                "name": "purple",
                "label": "紫色"
              },
              {
                "name": "yellow",
                "label": "黄色"
              }
            ]
          }
        }
      ]
    },
    {
      "name": "resources",
      "label": "资源书架 · 书籍 / 图片 / 视频",
      "type": "file",
      "path": "resources.json",
      "format": "json",
      "list": true,
      "fields": [
        {
          "name": "title",
          "label": "资源名称",
          "type": "string",
          "required": true
        },
        {
          "name": "resourceType",
          "label": "资源类型",
          "type": "select",
          "required": true,
          "options": {
            "values": [
              {
                "name": "book",
                "label": "书籍"
              },
              {
                "name": "image",
                "label": "图片"
              },
              {
                "name": "video",
                "label": "视频"
              }
            ]
          }
        },
        {
          "name": "description",
          "label": "资源简介",
          "type": "text",
          "required": true,
          "description": "介绍内容、适合谁；图片请写明画面，视频可补充内容摘要。"
        },
        {
          "name": "file",
          "label": "资源文件",
          "type": "file",
          "required": true,
          "description": "书籍上传 PDF / EPUB；图片上传 JPG / PNG / WebP / GIF；视频上传 MP4 / WebM。请上传有权公开的文件。",
          "options": {
            "extensions": [
              "pdf",
              "epub",
              "jpg",
              "jpeg",
              "png",
              "webp",
              "gif",
              "mp4",
              "webm"
            ]
          }
        },
        {
          "name": "cover",
          "label": "封面 / 视频海报（可选）",
          "type": "image",
          "options": {
            "extensions": [
              "jpg",
              "jpeg",
              "png",
              "webp",
              "gif"
            ]
          }
        },
        {
          "name": "author",
          "label": "作者 / 创作者（可选）",
          "type": "string"
        },
        {
          "name": "subtitles",
          "label": "视频字幕（可选）",
          "type": "file",
          "description": "视频如有声音，可上传 WebVTT 字幕文件。",
          "options": {
            "extensions": [
              "vtt"
            ]
          }
        },
        {
          "name": "tags",
          "label": "标签（可选）",
          "type": "string",
          "list": true
        },
        {
          "name": "date",
          "label": "收录日期",
          "type": "date",
          "required": true,
          "options": {
            "format": "yyyy-MM-dd"
          }
        }
      ]
    }
  ]
}
