name: Sync CMS navigation
on:
  push:
    branches: [main]
    paths:
      - '_data/home/introduction.json'
      - 'scripts/sync-navigation.cjs'
      - 'scripts/cms-base.json'
      - '.github/workflows/sync-navigation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cms-navigation
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Update CMS labels and new category editors
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/sync-navigation.cjs
            git add .pages.yml _data/cards _data/navigation
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Sync CMS category editors"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Navigation changed concurrently; retry this workflow."
          exit 1
